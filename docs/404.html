<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0A0716; --surface: #170F2B; --border: rgba(167,139,250,.2);
    --violet: #8B5CF6; --pink: #EC4899; --amber: #FBBF24;
    --text: #F7F3FF; --muted: #AC9FD4;
    --brand-grad: linear-gradient(120deg, var(--violet) 0%, var(--pink) 55%, var(--amber) 100%);
  }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    padding: 24px; gap: 20px; overflow: hidden;
  }
  .blob { position: fixed; width: 480px; height: 480px; border-radius: 50%; filter: blur(100px); opacity: .35; z-index: 0; }
  .blob-a { background: var(--violet); top: -160px; left: -140px; }
  .blob-b { background: var(--pink); bottom: -160px; right: -140px; }
  * > * { position: relative; z-index: 1; }
  .code {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(4rem, 14vw, 8rem);
    font-weight: 800;
    background: var(--brand-grad);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    line-height: 1;
  }
  h1 { font-family: 'Space Grotesk', sans-serif; font-size: 1.4rem; font-weight: 700; }
  p { color: var(--muted); max-width: 420px; line-height: 1.6; }
  a.home {
    display: inline-flex; align-items: center; gap: 8px;
    margin-top: 8px; padding: 13px 26px; border-radius: 12px;
    background: var(--brand-grad); color: #14071E; font-weight: 700;
    text-decoration: none; transition: transform .2s ease;
  }
  a.home:hover { transform: translateY(-2px); }
</style>
