<!-- Role: HTML entry point for the StreamDock renderer. -->
<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      img-src allows any https origin because thumbnails come from whatever
      site is being downloaded from (i.ytimg.com, an anime CDN, ...), which no
      allowlist can enumerate. The previous bing-only list blocked every video
      thumbnail the probe resolved, rendering a broken-image glyph in the queue.
      Scoped to images and still no plain http; nothing else in the policy is
      relaxed — script-src and connect-src stay as they were.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.bunny.net; font-src 'self' https://fonts.bunny.net; img-src 'self' data: https:; connect-src 'self' https://*.bing.com https://www.bing.com;">
    <title>StreamDock</title>
    <link rel="preconnect" href="https://fonts.bunny.net" />
    <link href="https://fonts.bunny.net/css?family=inter:400,500,600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
