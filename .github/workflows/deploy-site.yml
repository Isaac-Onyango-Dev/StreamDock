name: Deploy Site

# The site renders the version from package.json, and its download button points
# at `releases/latest/download/...`. Those two must not be allowed to disagree,
# which is why this no longer runs on a package.json push.
#
# It used to. That meant a version bump updated the site immediately while the
# release was still building — so for the length of a build the site advertised
# a version whose installer did not exist yet, and `releases/latest` served the
# previous one. Reacting to the release workflow *finishing* instead means the
# site only ever claims a version that is actually downloadable.
#
# workflow_run rather than `on: release: published`: the release is created with
# the default GITHUB_TOKEN, and GitHub does not let GITHUB_TOKEN-driven events
# trigger other workflows (anti-recursion protection), so `release: published`
# would silently never fire. workflow_run is not subject to that restriction.
on:
  workflow_run:
    workflows: ['Build & Release']
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'docs/index.template.html'
      - 'docs/assets/**'
      - 'docs/404.html'
      - 'docs/robots.txt'
      - 'docs/sitemap.xml'
      # NOT 'CHANGELOG.md'. A release commit edits CHANGELOG.md *and*
      # package.json, so listing it here started this workflow in parallel with
      # Build & Release instead of after it. Measured on the real v1.7.0 push,
      # where both fired at 15:13:08:
      #
      #   Deploy Site  (push/CHANGELOG.md)  15:13:08 -> 15:13:37   site says 1.7.0
      #   Build & Release                   15:13:08 -> 15:17:03   installer exists
      #
      # For those 3m26s the site advertised v1.7.0 while `releases/latest`
      # still served the v1.6.1 installer — the same user-visible failure that
      # dropping the package.json trigger was meant to end, reopened through a
      # second path. The workflow_run trigger above already covers the release
      # case and waits for the installers to exist; that is the 15:17:06 run.
      # A changelog edit that is NOT part of a release can be published with
      # workflow_dispatch.
      - 'scripts/build-site.ts'
      - 'scripts/sync-readme.ts'
      - 'scripts/lib/changelog.ts'
      - 'scripts/generate-tokens.ts'
      - 'design/tokens.json'
  workflow_dispatch:

# This workflow pushes a commit to main, so two overlapping runs would race on
# the same branch (the loser fails on a non-fast-forward). Queue them instead of
# cancelling: a cancelled run would leave the site un-synced with no retry.
concurrency:
  group: deploy-site
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Build and sync docs/index.html
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site and sync README
        # No RELEASE_TAG override: package.json is the source of truth, and the
        # release workflow is now triggered by a push to main rather than by a
        # tag, so workflow_run.head_branch is "main" — passing it here rendered
        # the site as "vmain".
        run: npm run sync:docs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- docs/index.html README.md; then
            echo "Site and README already in sync."
          else
            git add docs/index.html README.md
            git commit -m "chore: sync site and README to $(node -p "require('./package.json').version") [skip ci]"
            git push origin HEAD:main
          fi
