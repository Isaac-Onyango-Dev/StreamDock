name: Deploy Site

# release.yml's automated release is created with the default GITHUB_TOKEN,
# and GitHub Actions does not let GITHUB_TOKEN-driven events trigger other
# workflows (anti-recursion protection) — so `on: release: published` alone
# would silently never fire here. workflow_run instead reacts to the
# upstream workflow *run* completing, which isn't subject to that
# restriction, and is the pattern GitHub recommends for this exact case.
on:
  workflow_run:
    workflows: ['Build & Release']
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'docs/index.template.html'
      - 'docs/assets/**'
      - 'docs/404.html'
      - 'docs/robots.txt'
      - 'docs/sitemap.xml'
      - 'CHANGELOG.md'
      - 'scripts/build-site.ts'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Build and sync docs/index.html
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        env:
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch || github.event.release.tag_name || '' }}
        run: npm run build:site

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- docs/index.html; then
            echo "No site changes to deploy."
          else
            git add docs/index.html
            git commit -m "chore: sync site to $(node -p "require('./package.json').version") [skip ci]"
            git push origin HEAD:main
          fi
