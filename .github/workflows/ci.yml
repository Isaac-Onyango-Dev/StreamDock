name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint . --ext .ts,.tsx --max-warnings 0

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  version-guard:
    name: Version Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Tags are needed to compare the version against what is released.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check version is valid, documented and not moving backwards
        run: npm run check:version

  verify-engine:
    name: Verify Engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run engine verification
        run: npm run verify:engine

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build app
        run: npm run build:app

      # No DISPLAY / Xvfb: these specs drive headless Chromium against the Vite
      # dev server, not a real Electron window. A `DISPLAY: ':99'` was set here
      # with no X server ever started on :99, which made this job's failures look
      # environmental when they were a bad Playwright project config and an
      # ambiguous selector.
      - name: Run E2E tests
        run: npm run test:e2e
        timeout-minutes: 20

      - name: Upload E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: [typecheck, lint, test, verify-engine, version-guard]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download engine binaries (yt-dlp, ffmpeg, ffprobe)
        run: npm run download:binaries

      - name: Build Windows app
        # --publish never: release.yml is the only thing that uploads. The
        # publish config in package.json exists so electron-builder emits the
        # latest.yml update manifest, which it still does here; it must not also
        # push artifacts of its own.
        run: npm run build -- --publish never

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: streamdock-windows
          path: release/
          retention-days: 7

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: [typecheck, lint, test, verify-engine, version-guard]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build macOS app
        # --publish never: release.yml is the only thing that uploads. The
        # publish config in package.json exists so electron-builder emits the
        # latest.yml update manifest, which it still does here; it must not also
        # push artifacts of its own.
        run: npm run build -- --publish never

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: streamdock-macos
          path: release/
          retention-days: 7

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test, verify-engine, version-guard]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build Linux app
        # --publish never: release.yml is the only thing that uploads. The
        # publish config in package.json exists so electron-builder emits the
        # latest.yml update manifest, which it still does here; it must not also
        # push artifacts of its own.
        run: npm run build -- --publish never

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: streamdock-linux
          path: release/
          retention-days: 7