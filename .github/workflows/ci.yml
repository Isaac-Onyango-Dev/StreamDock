name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push supersedes an in-flight run. Safe to cancel: nothing here writes
# to the repository or publishes anything.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        # --max-warnings 0 keeps the zero-warning gate. `--ext` used to be passed
        # here and is a no-op under flat config — eslint.config.js decides which
        # files are linted.
        run: npm run lint -- --max-warnings 0

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Coverage is printed in this job's log by the 'text' reporter.
      #
      # There was a codecov/codecov-action upload here. It had never once
      # succeeded: no CODECOV_TOKEN is configured ("Token required - not valid
      # tokenless upload", three times per run) and vitest's reporters are
      # text/json/html, so the ./coverage/lcov.info it pointed at was never
      # generated either ("not_found_files"). fail_ci_if_error: false hid both
      # on every run. To re-enable it, add the CODECOV_TOKEN secret and add
      # 'lcov' to the coverage reporters in vitest.config.ts — both are needed.
      - name: Run unit tests with coverage
        run: npm run test:coverage

  version-guard:
    name: Version Guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # Tags are needed to compare the version against what is released.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check version is valid, documented and not moving backwards
        run: npm run check:version

  verify-engine:
    name: Verify Engine
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run engine verification
        run: npm run verify:engine

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # No `npm run build:app` here: playwright.config.ts's webServer starts Vite
      # against the source tree, so these specs never load dist/.
      #
      # No DISPLAY / Xvfb: these specs drive headless Chromium against the Vite
      # dev server, not a real Electron window. A `DISPLAY: ':99'` was set here
      # with no X server ever started on :99, which made this job's failures look
      # environmental when they were a bad Playwright project config and an
      # ambiguous selector.
      - name: Run E2E tests
        run: npm run test:e2e
        timeout-minutes: 20

      - name: Upload E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          # Both: the HTML report (reporter: 'html') and the traces
          # (trace: 'on-first-retry'). Only test-results/ was uploaded before,
          # under a name that promised the report it did not contain.
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Windows and Linux are packaged by BOTH workflows on a release commit: this
  # one on every push to main, and release.yml because package.json changed.
  # Measured on run 34243324496 — Build Windows 3m56s, Build Linux 2m15s — so a
  # release commit spends roughly six minutes of runner time re-downloading
  # ~400 MB of engines to produce artifacts the release workflow is already
  # producing and publishing.
  #
  # This job answers one question — "will release.yml package this commit?" — by
  # mirroring release.yml's own decision exactly: it triggers on a push to main
  # touching package.json, then skips if v<version> is already tagged. If either
  # half is false, the release workflow will not package this commit and the
  # build jobs below must.
  #
  # macOS is deliberately NOT gated on this: release.yml never builds macOS, so
  # this workflow is its only packaging check.
  release-packaging:
    name: Packaged by the release workflow?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      handled: ${{ steps.detect.outputs.handled }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # Tags are needed to tell an already-released version from a new one.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Decide
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          CHANGED=true
          # An unknown or absent "before" (first push, force push) means we cannot
          # diff — assume package.json changed, which only ever costs an extra
          # build rather than skipping one that was needed.
          if [ -n "$BEFORE" ] \
             && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            if git diff --quiet "$BEFORE" "${{ github.sha }}" -- package.json; then
              CHANGED=false
            fi
          fi

          VERSION="$(node -p "require('./package.json').version")"
          if [ "$CHANGED" = "true" ] && ! git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "handled=true" >> "$GITHUB_OUTPUT"
            echo "::notice::release.yml will package v${VERSION} — skipping the duplicate Windows and Linux builds here."
          else
            echo "handled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Not a release commit — packaging Windows and Linux here."
          fi

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    timeout-minutes: 45
    needs: [typecheck, lint, test, verify-engine, version-guard, release-packaging]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.release-packaging.outputs.handled != 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download engine binaries (yt-dlp, ffmpeg, ffprobe)
        run: npm run download:binaries

      - name: Verify the engines are present and runnable
        run: npm run check:binaries

      - name: Build Windows app
        # --publish never: release.yml is the only thing that uploads. The
        # publish config in package.json exists so electron-builder emits the
        # latest.yml update manifest, which it still does here; it must not also
        # push artifacts of its own.
        run: npm run build -- --publish never

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v5
        with:
          name: streamdock-windows
          # Not `release/`: electron-builder also leaves the unpacked app there
          # (linux-unpacked/ measured at 647 MB of a 913 MB release/ directory)
          # plus its builder-debug.yml dump. Uploading those cost minutes per run
          # and GitHub storage for something nobody installs. Same globs the
          # release workflow attaches, so `gh run download` still yields the
          # installer this repo tests with.
          path: |
            release/*.exe
            release/*.blockmap
            release/*.dmg
            release/*.AppImage
            release/latest*.yml
          if-no-files-found: error
          retention-days: 7

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    timeout-minutes: 45
    needs: [typecheck, lint, test, verify-engine, version-guard]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # No engine download here on purpose: BtbN publishes no macOS ffmpeg build,
      # so there is nothing to fetch and check:binaries would fail. This job is a
      # packaging/compile check; macOS is not a published target (see release.yml).
      - name: Build macOS app
        # --publish never: release.yml is the only thing that uploads. The
        # publish config in package.json exists so electron-builder emits the
        # latest.yml update manifest, which it still does here; it must not also
        # push artifacts of its own.
        run: npm run build -- --publish never

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v5
        with:
          name: streamdock-macos
          # Not `release/`: electron-builder also leaves the unpacked app there
          # (linux-unpacked/ measured at 647 MB of a 913 MB release/ directory)
          # plus its builder-debug.yml dump. Uploading those cost minutes per run
          # and GitHub storage for something nobody installs. Same globs the
          # release workflow attaches, so `gh run download` still yields the
          # installer this repo tests with.
          path: |
            release/*.exe
            release/*.blockmap
            release/*.dmg
            release/*.AppImage
            release/latest*.yml
          if-no-files-found: error
          retention-days: 7

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [typecheck, lint, test, verify-engine, version-guard, release-packaging]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.release-packaging.outputs.handled != 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Download engine binaries (yt-dlp, ffmpeg, ffprobe)
        run: npm run download:binaries

      - name: Verify the engines are present and runnable
        run: npm run check:binaries

      - name: Build Linux app
        # --publish never: release.yml is the only thing that uploads. The
        # publish config in package.json exists so electron-builder emits the
        # latest.yml update manifest, which it still does here; it must not also
        # push artifacts of its own.
        run: npm run build -- --publish never

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v5
        with:
          name: streamdock-linux
          # Not `release/`: electron-builder also leaves the unpacked app there
          # (linux-unpacked/ measured at 647 MB of a 913 MB release/ directory)
          # plus its builder-debug.yml dump. Uploading those cost minutes per run
          # and GitHub storage for something nobody installs. Same globs the
          # release workflow attaches, so `gh run download` still yields the
          # installer this repo tests with.
          path: |
            release/*.exe
            release/*.blockmap
            release/*.dmg
            release/*.AppImage
            release/latest*.yml
          if-no-files-found: error
          retention-days: 7