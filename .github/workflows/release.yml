name: Build & Release

# Why this triggers on a version change rather than on a tag
# ----------------------------------------------------------
# It used to be `on: push: tags: ['v*']` only. That workflow was never broken —
# v1.1.0 and v1.2.0 were both built and published by it. What was broken was the
# step *before* it: bumping package.json and pushing the tag were two separate
# manual acts, and only the first was habitually performed. So package.json
# reached 1.5.0 while the newest release stayed at v1.2.0, the site (which reads
# package.json) advertised a version that had never been published, and its
# download button — pointing at `releases/latest` — served the 1.2.0 installer.
#
# The version in package.json is the single source of truth, so a change to it
# on main IS the release signal. The tag becomes an output of the pipeline
# instead of its manual precondition, which is what makes the drift structurally
# impossible rather than merely discouraged.
#
# Note the tag is created by the release step itself, not pushed by a prior job.
# A tag pushed with GITHUB_TOKEN cannot trigger another workflow (GitHub's
# anti-recursion rule — the same trap that made `on: release: published` silently
# never fire in deploy-site.yml), so nothing here depends on a tag push
# triggering anything.

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (blank = whatever package.json says)'
        required: false
        type: string

# Never two release runs at once: both would resolve the same version and race to
# create the same tag. Queued rather than cancelled — a half-finished release is
# worse than a slow one.
concurrency:
  group: release
  cancel-in-progress: false

# Least privilege: only the publish job creates the tag and the release. `check`,
# `quality` and `build` just read the repo — and `build` in particular runs a lot
# of third-party code (npm install, downloaded engine binaries), which should not
# be holding a token that can write to the repository.
permissions:
  contents: read

jobs:
  check:
    name: Decide whether to release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
      should_release: ${{ steps.decide.outputs.should_release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Resolve version and check for an existing release
        id: decide
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="$(node -p "require('./package.json').version")"
          fi
          VERSION="${VERSION#v}"
          TAG="v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"

          # Re-running on an already-released version must be a no-op, not a
          # duplicate release: deploy-site.yml pushes a sync commit that touches
          # package.json, which would otherwise re-trigger this workflow forever.
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG already exists — nothing to release."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG is new — building and publishing it."
          fi

  # The gate the release itself owns.
  #
  # `build` used to depend only on `check`, so nothing stopped a commit with a
  # failing typecheck, a lint error or a broken test from being packaged and
  # published — ci.yml runs on the same commit, but in a separate workflow whose
  # result this one never observed. A release must verify the exact commit it
  # ships rather than trust another workflow's timing, so these run here too.
  # Same gate set ci.yml requires before packaging (e2e excluded there as well).
  quality:
    name: Quality gate
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # check:version compares against existing tags.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Unit tests
        run: npm test

      - name: Verify engine
        run: npm run verify:engine

      - name: Version is valid, documented and not moving backwards
        run: npm run check:version

  # Windows and Linux. macOS is deliberately absent.
  #
  # download-binaries.ts is now platform-aware, so each runner fetches the
  # engines that can actually run on it. macOS is still not published for two
  # reasons that are not about the build: BtbN publishes no macOS ffmpeg, and an
  # unsigned .dmg is refused by Gatekeeper as "damaged" — shipping that is worse
  # than shipping nothing. ci.yml still builds macOS so the packaging path stays
  # exercised.
  build:
    name: Build ${{ matrix.label }}
    needs: [check, quality]
    if: needs.check.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            artifact: streamdock-windows
          - os: ubuntu-latest
            label: Linux
            artifact: streamdock-linux
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Linux system dependencies
        # electron-builder needs these to assemble an AppImage; ci.yml's Linux
        # job already installed them, and the release job building the artifact
        # users actually download must not be the one missing them.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Download engine binaries (yt-dlp, ffmpeg, ffprobe)
        run: npm run download:binaries

      - name: Verify the engines are present and runnable
        # Between fetching and packaging on purpose. electron-builder cannot
        # tell an empty binaries/ from an intentional one, which is how v1.1.0
        # shipped with no engines at all.
        run: npm run check:binaries

      - name: Build app
        # --publish never so electron-builder only *generates* the artifacts and
        # the latest.yml update manifest; the publish job below is the single
        # upload path. Without this, electron-builder's default onTagOrDraft
        # policy would have it create a competing release of its own.
        run: npm run build -- --publish never

      - name: Upload build output
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.exe
            release/*.blockmap
            release/*.dmg
            release/*.AppImage
            release/latest*.yml
          # latest*.yml specifically, not *.yml: electron-builder also writes
          # builder-debug.yml, which is its own diagnostic dump and has no
          # business being offered to users as a release download. Only the
          # latest*.yml update manifests are consumed by electron-updater.
          if-no-files-found: warn
          retention-days: 3

  publish:
    name: Publish release ${{ needs.check.outputs.tag }}
    # The only job that writes: it creates the tag and the GitHub Release.
    permissions:
      contents: write
    needs: [check, build]
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Collect built assets
        uses: actions/download-artifact@v5
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: List what will be attached
        run: ls -lh dist-artifacts || echo "(no artifacts produced)"

      - name: Build release notes
        # The hand-written CHANGELOG section explains *why* each change happened;
        # generate_release_notes below appends GitHub's commit/PR list under it.
        run: npx tsx scripts/release-notes.ts "${{ needs.check.outputs.version }}" > RELEASE_NOTES.md

      - name: Create GitHub Release and attach assets
        uses: softprops/action-gh-release@v3
        with:
          # The tag does not exist yet; the action creates it at this commit.
          tag_name: ${{ needs.check.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: StreamDock ${{ needs.check.outputs.tag }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: dist-artifacts/*
          fail_on_unmatched_files: false
