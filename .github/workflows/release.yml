name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download engine binaries (yt-dlp, ffmpeg, ffprobe)
        run: npm run download:binaries

      - name: Build Windows app
        # --publish never so electron-builder only *generates* the artifacts and
        # the latest.yml update manifest; the upload below is the single
        # publishing path. Without this, a tag build satisfies electron-builder's
        # default onTagOrDraft policy and it would try to create its own release.
        run: npm run build -- --publish never

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          name: "StreamDock ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.blockmap
            release/*.7z
            release/latest.yml
          fail_on_unmatched_files: false